# 自动打包：手动触发或推 v* 标签时构建 Windows 便携版与 macOS dmg。
# 产物在 Actions 运行页的 Artifacts 下载；推 v* 标签时额外发布到 GitHub Release。
name: 打包客户端

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    name: Windows 目录版（zip）
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 注入运营配置
        shell: bash
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          # 线上配置（后台地址、OAuth 公共客户端 ID 等）不入库，从仓库 Secrets 注入。
          if [ -z "$APP_CONFIG_JSON" ]; then
            echo "缺少 secrets.APP_CONFIG_JSON，无法打出可用包" >&2
            exit 1
          fi
          printf '%s' "$APP_CONFIG_JSON" > resources/app.config.json
          node -e "JSON.parse(require('fs').readFileSync('resources/app.config.json','utf8'))" || { echo "APP_CONFIG_JSON 不是合法 JSON" >&2; exit 1; }
      - name: 打包
        run: npm run dist:win
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/zgyclaw-windows-amd64.zip
          if-no-files-found: error
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 两平台并行往同一 Release 发资产会有竞争：不存在就建、存在就补传，失败重试兜底。
          tag="${GITHUB_REF_NAME}"
          pattern="release/zgyclaw-windows-amd64.zip"
          for attempt in 1 2 3 4 5; do
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes >/dev/null 2>&1 || true
            if gh release upload "$tag" $pattern --clobber; then
              echo "已上传: $pattern"
              exit 0
            fi
            echo "上传失败，10 秒后重试（$attempt/5）"
            sleep 10
          done
          echo "发布失败" >&2
          exit 1

  macos:
    name: macOS dmg（arm64 + x64）
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 注入运营配置
        shell: bash
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          # 线上配置（后台地址、OAuth 公共客户端 ID 等）不入库，从仓库 Secrets 注入。
          if [ -z "$APP_CONFIG_JSON" ]; then
            echo "缺少 secrets.APP_CONFIG_JSON，无法打出可用包" >&2
            exit 1
          fi
          printf '%s' "$APP_CONFIG_JSON" > resources/app.config.json
          node -e "JSON.parse(require('fs').readFileSync('resources/app.config.json','utf8'))" || { echo "APP_CONFIG_JSON 不是合法 JSON" >&2; exit 1; }
      - name: 打包
        run: npm run dist:mac
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 两平台并行往同一 Release 发资产会有竞争：不存在就建、存在就补传，失败重试兜底。
          tag="${GITHUB_REF_NAME}"
          pattern="release/*.dmg"
          for attempt in 1 2 3 4 5; do
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes >/dev/null 2>&1 || true
            if gh release upload "$tag" $pattern --clobber; then
              echo "已上传: $pattern"
              exit 0
            fi
            echo "上传失败，10 秒后重试（$attempt/5）"
            sleep 10
          done
          echo "发布失败" >&2
          exit 1
