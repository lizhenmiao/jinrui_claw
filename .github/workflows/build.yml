# 自动打包：手动触发或推 v* 标签时构建 Windows 便携版与 macOS dmg。
# 产物在 Actions 运行页的 Artifacts 下载；推 v* 标签时额外发布到 GitHub Release。
name: 打包客户端

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    name: Windows 单文件便携版
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 打包
        run: npm run dist:win
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/zgyclaw-windows-amd64.exe
          if-no-files-found: error
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/zgyclaw-windows-amd64.exe
          generate_release_notes: true

  macos:
    name: macOS dmg（arm64 + x64）
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 打包
        run: npm run dist:mac
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          generate_release_notes: true
